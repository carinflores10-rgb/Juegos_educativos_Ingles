<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Race - English Game</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --warning: #f72585;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --player1: #ff006e;
            --player2: #fb5607;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Setup Screen */
        .input-group {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            width: 80%;
            max-width: 300px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: var(--secondary);
        }

        /* Game Screen */
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
        }

        .turn-indicator {
            color: var(--warning);
            font-size: 24px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* The Board */
        .board {
            margin-bottom: 30px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
        }

        .track {
            display: grid;
            grid-template-columns: repeat(21, 1fr);
            gap: 2px;
            margin: 10px 0;
            background: #ccc;
            border: 2px solid #aaa;
            position: relative;
        }

        .cell {
            height: 40px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #ccc;
        }

        .cell:last-child {
            background: #ffd166;
            color: #000;
            font-weight: bold;
        }

        .player-token {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            position: absolute;
            top: 7px;
            transition: left 0.5s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 2;
        }

        #token-1 { background-color: var(--player1); }
        #token-2 { background-color: var(--player2); }

        .track-label {
            text-align: left;
            font-weight: bold;
            margin-bottom: -5px;
            margin-top: 10px;
            font-size: 14px;
        }
        #label-p1 { color: var(--player1); }
        #label-p2 { color: var(--player2); }

        /* Question Area */
        .question-card {
            background: var(--success);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            color: var(--text);
            border: 2px solid var(--success);
            font-size: 18px;
            padding: 15px;
        }

        .option-btn:hover {
            background: var(--success);
            color: white;
        }

        /* End Screen */
        .winner-text {
            font-size: 40px;
            color: var(--warning);
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="setup-screen" class="screen active">
        <h1>Furniture Race</h1>
        <p>Alcanza los 100 puntos (5 pts por respuesta correcta) para ganar.</p>
        <div class="input-group">
            <input type="text" id="p1-name" placeholder="Nombre Jugador 1" required autocomplete="off">
            <input type="text" id="p2-name" placeholder="Nombre Jugador 2" required autocomplete="off">
            <button onclick="initGame()">Comenzar Carrera</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="status-bar">
            <span id="score-p1">Jugador 1: 0 pts</span>
            <span id="score-p2">Jugador 2: 0 pts</span>
        </div>

        <div class="turn-indicator" id="turn-display">Turno de: -</div>

        <div class="board" id="board-container">
            <div class="track-label" id="label-p1">Pista J1</div>
            <div class="track" id="track-1">
                <div class="player-token" id="token-1"></div>
            </div>

            <div class="track-label" id="label-p2">Pista J2</div>
            <div class="track" id="track-2">
                <div class="player-token" id="token-2"></div>
            </div>
        </div>

        <div class="question-card" id="question-text">Preparando pregunta...</div>
        <div class="options-grid" id="options-container">
            <!-- Botones inyectados vía JS -->
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen">
        <h1>¡Carrera Terminada!</h1>
        <div class="winner-text" id="winner-announcement">Ganador: -</div>
        <button onclick="location.reload()">Jugar de Nuevo</button>
    </div>

    <script>
        // Lógica de datos y estado
        const POINTS_PER_QUESTION = 5;
        const POINTS_TO_WIN = 100;
        const TOTAL_STEPS = POINTS_TO_WIN / POINTS_PER_QUESTION; // 20 casillas

        let players = [
            { name: '', score: 0, position: 0 },
            { name: '', score: 0, position: 0 }
        ];
        let currentPlayerIndex = 0;
        
        // Banco de preguntas nivel A1/A2 (30 preguntas)
        const originalQuestionBank = [
            { q: "¿Cómo se dice 'cama' en inglés?", options: ["Bed", "Sofa", "Chair", "Table"], a: "Bed" },
            { q: "You sit on it in the living room. It fits 3 people.", options: ["Sofa", "Desk", "Lamp", "Mirror"], a: "Sofa" },
            { q: "¿Dónde guardas la ropa?", options: ["Wardrobe", "Oven", "Sink", "Bookshelf"], a: "Wardrobe" },
            { q: "A piece of furniture with shelves to hold books.", options: ["Bookshelf", "Rug", "Stool", "Drawer"], a: "Bookshelf" },
            { q: "¿Qué mueble usas para comer?", options: ["Table", "Bed", "Armchair", "Toilet"], a: "Table" },
            { q: "You use it to see your reflection.", options: ["Mirror", "Curtain", "Window", "Carpet"], a: "Mirror" },
            { q: "It provides light in a dark room.", options: ["Lamp", "Desk", "Couch", "Cabinet"], a: "Lamp" },
            { q: "¿Cómo se dice 'alfombra'?", options: ["Rug", "Curtain", "Blanket", "Towel"], a: "Rug" },
            { q: "You work or study on this piece of furniture.", options: ["Desk", "Sofa", "Bathtub", "Fridge"], a: "Desk" },
            { q: "A small seat without a back or arms.", options: ["Stool", "Armchair", "Bed", "Table"], a: "Stool" },
            { q: "¿Dónde mantienes la comida fría?", options: ["Fridge", "Oven", "Microwave", "Sink"], a: "Fridge" },
            { q: "You use it to bake a cake or roast meat.", options: ["Oven", "Toilet", "Drawer", "Lamp"], a: "Oven" },
            { q: "¿Cómo se dice 'Sillón' (para una persona)?", options: ["Armchair", "Chair", "Sofa", "Stool"], a: "Armchair" },
            { q: "It covers the window to block the sun.", options: ["Curtain", "Rug", "Mirror", "Painting"], a: "Curtain" },
            { q: "You wash your hands and face here.", options: ["Sink", "Toilet", "Bathtub", "Oven"], a: "Sink" },
            { q: "¿Dónde te acuestas a descansar en la sala?", options: ["Couch", "Desk", "Chair", "Cabinet"], a: "Couch" },
            { q: "A small table next to your bed.", options: ["Nightstand", "Bookshelf", "Desk", "Wardrobe"], a: "Nightstand" },
            { q: "You use this for a long, warm wash of your body.", options: ["Bathtub", "Sink", "Fridge", "Stool"], a: "Bathtub" },
            { q: "¿Cómo se dice 'cajón'?", options: ["Drawer", "Door", "Shelf", "Box"], a: "Drawer" },
            { q: "You watch movies and shows on it.", options: ["Television", "Mirror", "Microwave", "Oven"], a: "Television" },
            { q: "A piece of furniture used for storing dishes or glasses.", options: ["Cabinet", "Bed", "Rug", "Armchair"], a: "Cabinet" },
            { q: "¿Qué usas para calentar comida rápidamente?", options: ["Microwave", "Fridge", "Sink", "Bookshelf"], a: "Microwave" },
            { q: "Basic seating for one person at a dining table.", options: ["Chair", "Sofa", "Couch", "Wardrobe"], a: "Chair" },
            { q: "¿En qué mueble pones una lámpara pequeña junto a tu cama?", options: ["Nightstand", "Stool", "Mirror", "Oven"], a: "Nightstand" },
            { q: "The essential fixture in a bathroom for human waste.", options: ["Toilet", "Sink", "Bathtub", "Shower"], a: "Toilet" },
            { q: "¿Cómo se dice 'estante' o 'repisa'?", options: ["Shelf", "Drawer", "Desk", "Curtain"], a: "Shelf" },
            { q: "A soft covering for the floor.", options: ["Carpet", "Curtain", "Mirror", "Lamp"], a: "Carpet" },
            { q: "¿Qué palabra es sinónimo de 'Sofa'?", options: ["Couch", "Chair", "Bed", "Desk"], a: "Couch" },
            { q: "You pull this out of a desk to find your pens.", options: ["Drawer", "Mirror", "Rug", "Sink"], a: "Drawer" },
            { q: "It is usually in the kitchen to clean dirty dishes.", options: ["Sink", "Bathtub", "Oven", "Fridge"], a: "Sink" }
        ];

        let activeQuestions = [];
        let currentQuestion = null;

        // Utilidad: Barajar array (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Controladores de UI
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initGame() {
            const p1 = document.getElementById('p1-name').value.trim();
            const p2 = document.getElementById('p2-name').value.trim();

            if (!p1 || !p2) {
                alert("Por favor, introduce los nombres de ambos jugadores.");
                return;
            }

            players[0].name = p1;
            players[1].name = p2;

            document.getElementById('label-p1').innerText = `Carril de ${p1}`;
            document.getElementById('label-p2').innerText = `Carril de ${p2}`;
            
            buildTrack('track-1');
            buildTrack('track-2');

            activeQuestions = shuffle([...originalQuestionBank]);
            
            updateScores();
            switchScreen('game-screen');
            nextTurn();
        }

        function buildTrack(trackId) {
            const trackElement = document.getElementById(trackId);
            // Preservar el token
            const token = trackElement.querySelector('.player-token');
            trackElement.innerHTML = '';
            trackElement.appendChild(token);

            for (let i = 0; i <= TOTAL_STEPS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (i === TOTAL_STEPS) cell.innerText = "FIN";
                trackElement.appendChild(cell);
            }
        }

        function updateScores() {
            document.getElementById('score-p1').innerText = `${players[0].name}: ${players[0].score} pts`;
            document.getElementById('score-p2').innerText = `${players[1].name}: ${players[1].score} pts`;
            
            // Actualizar posiciones visuales
            const moveToken = (playerIndex, trackId, tokenId) => {
                const trackWidth = document.getElementById(trackId).offsetWidth;
                const cellWidth = trackWidth / (TOTAL_STEPS + 1);
                // Calcular la posición izquierda en píxeles. Se ajusta + 25% del ancho de celda para centrar.
                const pos = players[playerIndex].position * cellWidth + (cellWidth * 0.1); 
                document.getElementById(tokenId).style.left = `${pos}px`;
            };

            moveToken(0, 'track-1', 'token-1');
            moveToken(1, 'track-2', 'token-2');
        }

        function nextTurn() {
            const turnDisplay = document.getElementById('turn-display');
            turnDisplay.innerText = `Turno de: ${players[currentPlayerIndex].name}`;
            turnDisplay.style.color = currentPlayerIndex === 0 ? 'var(--player1)' : 'var(--player2)';
            
            loadQuestion();
        }

        function loadQuestion() {
            // Recargar banco si se agota
            if (activeQuestions.length === 0) {
                activeQuestions = shuffle([...originalQuestionBank]);
            }

            currentQuestion = activeQuestions.pop();
            document.getElementById('question-text').innerText = currentQuestion.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const shuffledOptions = shuffle([...currentQuestion.options]);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption) {
            // Deshabilitar botones para evitar clics múltiples
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selectedOption === currentQuestion.a) {
                players[currentPlayerIndex].score += POINTS_PER_QUESTION;
                players[currentPlayerIndex].position += 1;
            } else {
                alert(`Incorrecto. La respuesta era: ${currentQuestion.a}`);
            }

            updateScores();

            // Evaluar condición de victoria
            if (players[currentPlayerIndex].score >= POINTS_TO_WIN) {
                setTimeout(() => endGame(players[currentPlayerIndex].name), 500);
            } else {
                // Cambiar turno
                currentPlayerIndex = currentPlayerIndex === 0 ? 1 : 0;
                setTimeout(nextTurn, 300); // Pequeña pausa antes del próximo turno
            }
        }

        function endGame(winnerName) {
            document.getElementById('winner-announcement').innerText = `¡Felicidades, ${winnerName}!`;
            switchScreen('end-screen');
        }
    </script>
</body>
</html>
